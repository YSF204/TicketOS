services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketos}
      POSTGRES_USER: ${POSTGRES_USER:-ticketos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketos_local_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketos} -d ${POSTGRES_DB:-ticketos}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
